name: api-platform

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: api-platform
      POSTGRES_USER: api-platform
      POSTGRES_PASSWORD: api-platform
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api-platform -d api-platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
