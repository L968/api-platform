name: api-platform

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: api-platform
      POSTGRES_USER: api-platform
      POSTGRES_PASSWORD: api-platform
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api-platform -d api-platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PROJECT: ApiPlatform.PortalApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PortalDb: Host=postgres;Port=5432;Database=api-platform;Username=api-platform;Password=api-platform;Pooling=true;MinPoolSize=5;MaxPoolSize=50;CommandTimeout=30
      Database__Initialize: "true"
      Database__SeedFile: /app/database/seed.sql
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  orders-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PROJECT: ApiPlatform.OrdersApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PROJECT: ApiPlatform.PaymentsApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PROJECT: ApiPlatform.Gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PortalDb: Host=postgres;Port=5432;Database=api-platform;Username=api-platform;Password=api-platform;Pooling=true;MinPoolSize=5;MaxPoolSize=50;CommandTimeout=30
      ReverseProxy__Clusters__portal__Destinations__primary__Address: http://portal-api:8080/
      ReverseProxy__Clusters__orders__Destinations__primary__Address: http://orders-api:8080/
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments-api:8080/
    ports:
      - "5290:8080"
    depends_on:
      postgres:
        condition: service_healthy
      portal-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
      payments-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PORTAL_API_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
